# Builds speedrun for Intel Macs when a release is tagged (Android only: the iOS agent needs
# Xcode 15, which an Intel Mac's macOS cannot run) and attaches the package to the tag's GitHub
# release, created if the tag has none yet. Run by hand (Actions > macOS Intel release > Run
# workflow) to build an existing tag again.
name: macOS Intel release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and attach (e.g. v0.4.11)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  ODIN_VERSION: dev-2026-09
  # The C code (QuickJS, stb) is built with the runner's compiler: without this its objects
  # would ask for the runner's macOS. Odin links the binary for macOS 11 by itself.
  MACOSX_DEPLOYMENT_TARGET: '12.0'
  SPEEDRUN_NO_IOS: 1

jobs:
  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Odin
        run: |
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-macos-amd64-$ODIN_VERSION.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          dirname "$(find "$RUNNER_TEMP" -maxdepth 3 -name odin -type f | head -1)" >> "$GITHUB_PATH"

      - name: Build and package
        run: SPEEDRUN_VERSION="$TAG" ./package.sh

      - name: Check the package
        run: |
          tar -xzf dist/speedrun-*-macos-x86_64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/speedrun-*-macos-x86_64/speedrun --version
          otool -l "$RUNNER_TEMP"/speedrun-*-macos-x86_64/speedrun | grep -A4 LC_BUILD_VERSION

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "speedrun $TAG" --notes "speedrun $TAG"
          gh release upload "$TAG" dist/speedrun-*-macos-x86_64.tar.gz dist/speedrun-*-macos-x86_64.tar.gz.sha256 --clobber
